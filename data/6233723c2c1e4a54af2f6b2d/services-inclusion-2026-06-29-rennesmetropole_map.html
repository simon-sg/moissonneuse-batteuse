s parcours de formation. A partir d'un scénario d'accompagnement, il met en œuvre les différentes étapes de l'accompagnement. Il mobilise les acteurs relais au sein ou à l'extérieur de son organisation, en réponse aux besoins des apprenants. Il accueille et positionne les apprenants afin d'individualiser leurs parcours.  Il assure un suivi individualisé et collectif et propose d'éventuels ajustements de parcours. Lorsqu'il accompagne les apprenants à distance, le formateur met en place des actions de tutorat spécifiques à la formation à distance. L'accompagnement permet également de contribuer au développement professionnel des apprenants en favorisant des compétences et des comportements adaptés à leurs projets professionnels.### Contenu de la formation**Bloc 1 - Concevoir et préparer une formation**  **Elaborer la progression pédagogique d'une formation multimodale à partir d'une demande**  Analyser une demande, formaliser les compétences et savoirs associés, identifier les besoins de formation, Repérer les publics et formaliser les objectifs, élaborer des scénarios pédagogiques détaillés  **Concevoir des scénarios intégrant la multimodalité**  Définir les objectifs pédagogiques, choisir les modalités pédagogiques, planifier les temps d'apprentissage et d'évaluation,  définir les activités, outils et évaluations, intégrer de l'analyse réflexive, des pédagogies actives  **Concevoir des activités d'apprentissage et d'évaluation selon différentes modalités**  Recenser les ressources existantes, définir les activités à concevoir, réaliser un storyboard détaillé, rédiger des consignes adaptées, choisir les supports numériques, et concevoir les activités et ressources pédagogiques  **Bloc 2 - Animer une formation et évaluer les acquis des apprenants**  **Animer une formation** selon différentes modalités, en présentant les objectifs, méthodes, et outils prévus, utilisant des outils d'animation traditionnels ou numériques, donnant des consignes claires aux apprenants  Employer des méthodes actives et des outils adaptés, favorisant l'autonomie et l'apprentissage  Gérer la dynamique de groupe et repérer les acquis et difficultés des apprenants, ajuster si besoin le scénario prévu  **Évaluer les acquis des apprenan****ts** en construisant des activités et outils d'évaluation selon les modalités prévues initialement, définissant critères et indicateurs.  Présenter explicitement les consignes d'évaluation, accompagner les apprenants dans l'auto-évaluation et l'évaluation par les pairs.  Analyser les résultats, proposer des rétroactions adaptées et exploiter les erreurs comme opportunités d'apprentissage.  Rédiger des bilans individuels et de groupe.  **Remédier aux difficultés d'apprentissage en anticipant et repérant les signes de décrochage.**   Mener des entretiens pour comprendre les causes, coconstruire des stratégies de remédiation avec les apprenants, adapter la formation en tenant compte des profils spécifiques.  Concevoir et mettre en œuvre des activités de remédiation individuelles, évaluer leur efficacité dans le respect de la progression collective.  **Concevoir et mettre en œuvre des activités de remédiation individuelles**, évaluer leur efficacité dans le respect de la progression collective", "type": "formation", "thematiques": "['lecture-ecriture-calcul--maitriser-le-francais', 'lecture-ecriture-calcul--maitriser-le-calcul']", "publics": "['actifs']", "commune": "Bruz", "code_postal": "35170", "code_insee": "35047", "adresse": "Rue des Freres Montgolfier, Campus de Ker Lann / BP 17201", "lien_source": "https://www.intercariforef.org/formations/concevoir-et-preparer-la-formation-animer-une-formation-et-evaluer-les-acquis-des-apprenants-blocs-de-competences-du-titre-pro-formateur-professionnel-d-adultes/formation-06_24131030F_2210766S.html", "telephone": "+33299054623", "courriel": "jrichard@fac-metiers.fr", "date_maj": "2026-02-26", "mobilisable_par": "['professionnels']", "modes_accueil": "['a-distance']", "modes_mobilis rocédures de recrutement ;* Qui préparent leur entrée en formation qualifiante dans le cadre du dispositif région « Accompagnement à la Qualification ».A l'issue du parcours «je consolide mes compétences », les compétences acquises sont valorisées dans le cadre d'une attestation. Les compétences acquises peuvent également au cas par cas être reconnues par la délivrance de badges de compétences notamment sur les compétences transverses et les soft skills### Contenu de la formationCe parcours doit permettre au stagiaire :  - D'évaluer ses compétences ;  Soit d'acquérir le(s) niveau(x) requis dans un ou plusieurs domaines des compétences socles et/ou des compétences générales en lien avec le niveau requis pour l'accès à la formation qualifiante, l'accès à un diplôme ou à un concours, l'accès à un emploi ;  - De développer ses compétences numériques.  Les domaines de compétences travaillés sont :  Domaine 1 : Communiquer en français ;  Domaine 2 : Utiliser les règles de base de calcul et du raisonnement  mathématique ;  Domaine 3 : Utiliser les techniques usuelles de l'information et de la  communication numérique ;  Domaine 4 : Travailler dans le cadre de règles définies d'un travail en équipe  ;  Domaine 5 : Travailler en autonomie et réaliser un objectif individuel ;  Domaine 6 : Apprendre à apprendre tout au long de la vie ;  Domaine 7 : Maîtriser les gestes et postures, et respecter des règles  d'hygiène, de sécurité et environnementales élémentaires ;  Domaine 8 : Communiquer en anglais ;  Domaine 10 : Maîtriser les compétences de base en biologie et en sciences.  Les contenus pédagogiques s'appuient sur les référentiels d'enseignement général de niveaux 3 et 4, les référentiels CléA et CléA numérique, PIX,… Les compétences transversales font également l'objet d'apports pédagogiques dans le cadre des ateliers proposés Les situations d'apprentissage sont contextualisées ; proches des réalités du travail et/ou des situations de la vie quotidienne. Les travaux indivi ligibilité et candidatez dès maintenant sur notre plateforme.### Qui ?Nos offres de logements à loyers abordables s’adressent aux salariés d’une entreprise privée (10 salariés minimum) ou d’une entreprise du secteur agricole (50 salariés minimum) en recherche d’une solution de logement stable et abordable. **Deux types d’offres sont disponibles :**- Les logements privés accessibles à tous, notamment pour les salariés en début de carrière, en mobilité ou en mutation professionnelle.- Les logements intermédiaires, destinés aux ménages dépassant les plafonds du logement social mais rencontrant des difficultés pour se loger sur le marché privé.###  Pourquoi choisir ces logements ?**En bénéficiant de nos offres, vous accédez à des logements :**- À loyers maîtrisés, en dessous du prix du marché,- Proches des bassins d’emploi et des commodités essentielles,- Éligibles à des aides complémentaires pour faciliter votre accès au logement.### Comment ?1. Rendez-vous sur notre plateforme de logement dédiée pour créer votre compte.2. Renseignez vos informations personnelles et sélectionnez vos critères de recherche.3. Visualisez des logements et déposez votre candidature sur le logement de votre choix.4. Déposez l’ensemble des pièces justificatives depuis votre espace personnel puis suivez l’état d’avancement de vos candidatures.**Attention**L’accès aux offres de logement, aux services d’accompagnement locatif proposés par Action Logement sont strictement gratuits et ne peuvent pas faire l’objet d’une quelconque facturation ou rétribution. Par ailleurs, Action Logement n’établit et n’adresse aucun bon de visite aux candidats. Pour l’attribution d’un logement dans une résidence de logements temporaires, certains gestionnaires peuvent vous facturer des frais de dossiers mais ceux-ci sont détaillés et contractuels. En dehors de ce cas, si de l’argent vous est demandé, il s’agit d’une fraude que vous pouvez dénoncer à l’adresse fraude.als@actionlogement.fr", "type": "accompagnement",  "0.8499999999999999"}], [48.086855, -1.673443, {"id": "dora--c35d53bf-4976-4140-8e8e-b83eb5a2c2be", "structure_id": "dora--0859086f-2404-4829-a01d-83e2bd0df1e8", "source": "dora", "nom": "Accompagner les travailleurs indépendants allocataires du RSA (suivi post-création)", "description": "**Qui est concerné ?**Les allocataires du RSA exerçant une activité indépendante, dont les revenus dégagés sont peu élevés et ne permettent pas de se passer du RSA et sont soumis aux droits et devoirs quelle que soit la nature de leur activité (hors artiste et non-salariés agricoles), quel que soit leur statut.**Qui accompagne ?**La BGE Bretagne, qui vient en appui aux entrepreneurs par des conseils de gestion, de marketing, par des formations.Elle dispose de 9 lieux d'accueils en Ille-et-Vilaine : Combourg, Fougères, Janzé, Montauban de Bretagne, Redon, Rennes, Retiers, Saint Malo, Vitré.Le travailleur indépendant est reçu dans la BGE la plus proche de son domicile.**Comment se déroule l'action ?**L'action se compose de deux volets complémentaires :- Réalisation d'un diagnostic de l'activité et des aptitudes entrepreneuriales du travailleur indépendant pour mener à bien son projet,- Mise en œuvre d'un accompagnement pour permettre la sortie positive du dispositif RSA (soit par le développement de l'activité, soit en y mettant fin en trouvant d'autres solutions professionnelles).<!-- -->**Quel suivi et retour de cette action ?**Un comité de suivi composé de représentants du Département et de l'opérateur est en charge de l'évaluation et du suivi des prestations.La BGE Bretagne transmet la fiche de prescription du référent RSA et la fiche de bilan individuel de parcours indiquant les préconisations sur les suites du parcours du bénéficiaire de l'action au référent et au Service Offre d'Insertion du département.**Un soutien financier est-il possible ?**Oui, un soutien financier par un crédit d'insertion est mobilisable dans le cadre du règlement intérieur en vigueur.**Quelles démarches entreprendre pour prescrire l'action ?**Seuls les référents RSA et les conseillers de la Mission locale ont l’autorisation de réaliser une demande de prescription. La fiche est disponible via le service insertion du département.", "type": "aide-financiere", "thematiques": "['creer-une-entreprise--developper-son-entreprise']", "frais": "gratuit", "publics": "['beneficiaires-des-minimas-sociaux']", "publics_precisions": "Bénéficiaire du Revenu de Solidarité Active (RSA)", "commune": "Rennes", "code_postal": "35200", "code_insee": "35238", "adresse": "3 Rue d'Espagne", "complement_adresse": "Immeuble Le Méridien", "lien_source": "https://dora.inclusion.gouv.fr/services/departement-d-ille-e-accompagner-les-trav", "date_maj": "2026-03-27", "lien_mobilisation": "https://dora.inclusion.gouv.fr/services/departement-d-ille-e-accompagner-les-trav/orienter", "mobilisable_par": "['professionnels']", "modes_accueil": "['en-presentiel']", "modes_mobilisation": "['envoyer-un-courriel', 'utiliser-lien-mobilisation']", "zone_eligibilite": "['35']", "score_qualite": "0.89"}], [48.087386, -1.660718, {"id": "dora--26cdb7e5-ede0-407a-ba1a-8264da82b480", "structure_id": "dora--7228c815-1be9-4bf9-b5bb-9eb8c9b63651", "source": "dora", "nom": "Quartier du Blosne : retrouver un travail", "description": "L'association recrute des personnes privées d'emploi de longue durée sur le territoire du Blosne.", "type": "accompagnement", "thematiques": "['choisir-un-metier--connaitre-les-opportunites-demploi', 'difficultes-financieres--acquerir-une-autonomie-budgetaire', 'preparer-sa-candidature--organiser-ses-demarches-de-recherche-demploi', 'trouver-un-emploi--repondre-a-des-offres-demploi']", "frais": "gratuit", "publics": "['tous-publics']", "commune": "Rennes", "code_postal": "35200", "code_insee": "35238", "adresse": "47 Avenue des Pays-Bas", "lien_source": "https://dora.inclusion.gouv.fr/services/blosnup-quartier-du-blosne-r", "date_maj": "2026-02-27", "mobilisable_par": "['usagers', 'profess s à envisager**Phase 2 : Accompagnement (6 mois)**· Etablir avec le travailleur indépendant un plan d’actions visant à développer l’activité de son entreprise, à assurer sa viabilité économique et par conséquent à permettre l’autonomie financière de l’allocataire. La mise en place d’une activité salariée en complément du maintien de l’activité indépendante (double activité) peut être une alternative.· En cas de préconisation d’arrêt de l’activité, accompagner le dirigeant dans ses démarches de cessation d’activité, travailler avec lui sur l’élaboration d’un nouveau projet professionnel.Les prescripteurs transmettent les fiches de prescription au gestionnaire du Service offre d’insertion, Direction Lutte contre les exclusions. Le Service offre d’insertion regroupe les prescriptions reçues dans un bon de commande avec un numéro d’engagement, et adresse ce bon de commande signé par le chef du Service offre d’insertion au titulaire.", "type": "accompagnement", "thematiques": "['creer-une-entreprise--structurer-son-projet-de-creation-dentreprise']", "frais": "gratuit", "publics": "['actifs', 'beneficiaires-des-minimas-sociaux', 'demandeurs-emploi']", "publics_precisions": "Créateur repreneur d'entreprise, Bénéficiaire du Revenu de Solidarité Active (RSA), Travailleur indépendant", "commune": "Rennes", "code_postal": "35200", "code_insee": "35238", "adresse": "3 Rue d'Espagne", "complement_adresse": "espace entreprise", "lien_source": "https://dora.inclusion.gouv.fr/services/bge-bretagne-micro-entrepreneurs--rwkv", "date_maj": "2025-10-08", "mobilisable_par": "['professionnels']", "modes_accueil": "['en-presentiel']", "modes_mobilisation": "['envoyer-un-courriel']", "zone_eligibilite": "['35']", "nombre_semaines": "36.0", "score_qualite": "0.71"}], [48.10528, -1.676035, {"id": "dora--b606a4d0-1643-4499-94f1-a7b466c01b46", "structure_id": "dora--c0331ab6-6cf3-4fd9-ad03-08f129d60703", "source": "dora", "nom": "Accompagnement Caisse de l'Assurance Maladie", "description": "* ence ou en présentiel. Le cours a pour objectif de valider toutes les compétences travaillées en amont dans chaque module. La planification des cours est entièrement flexible et adaptée à vos disponibilités ; possibilité de reporter votre cours jusqu'à 6 heures avant pour les cours à distance et 48 heures avant pour le présentiel.3. Passage de l'examen CLOE : le parcours se conclut par le passage du CLOE afin de mesurer votre progression et valider vos compétences dans un contexte professionnel. Le passage de la certification est obligatoire. Vous serez accompagné(e) par notre équipe pédagogique dans l'organisation et l'optimisation de votre passage de test.", "type": "formation", "thematiques": "['lecture-ecriture-calcul--maitriser-le-francais']", "publics": "['actifs']", "commune": "Saint-Grégoire", "code_postal": "35760", "code_insee": "35278", "adresse": "Espace Performance - Centre Alphasis, Batiment G1", "lien_source": "https://www.intercariforef.org/formations/fle-professionnel-debutant-a-expert-a2-b1-b2-et-c1-cloe/formation-06_23109444F_2169621S.html", "telephone": "+33645952227", "courriel": "josee.legloanic@yesnyou.com", "date_maj": "2026-06-26", "mobilisable_par": "['professionnels']", "modes_accueil": "['a-distance']", "modes_mobilisation": "['telephoner', 'envoyer-un-courriel']", "zone_eligibilite": "['22', '29', '35', '56']", "score_qualite": "0.8299999999999998"}], [48.044249, -1.744371, {"id": "carif-oref--06_1813719S", "structure_id": "carif-oref--06_04123P", "source": "carif-oref", "nom": "MOVIL'APP - ERASMUS + Formation professionnelle en entreprise en Europe", "conditions_acces": "- Etre demandeur d emploi - Etre diplome d une formation de niveau CAP a MASTER preparee par le voie de l apprentissage dans un CFA partenaire du programme MOVIL APP. - Toutes les filieres de metiers proposees par les CFA partenaires du programme MOVIL APP Erasmus+ sont eligibles - Avoir un projet professionnel en coherence avec le souhait de vivre une experience profes ins-infirmiers-a-domicile", "structure_id": "cd35--2607", "source": "cd35", "nom": "Soins  infirmiers  à domicile", "description": "Les SSIAD : des services de soins infirmiers pour les personnes âgées en perte d’autonomieLes SSIAD sont des services de soins infirmiers dédiés aux personnes âgées de plus de 60 ans en perte d’autonomie. Les SSIAD peuvent  également intervenir auprès de personnes de moins de 60 ans lorsqu’elles sont handicapées ou atteintes d’une maladie chronique.Les interventions des SSIAD auprès des personnes âgées ont pour but :de prévenir la perte d’autonomie,d'éviter une hospitalisation,de faciliter le retour à domicile après une hospitalisation,de retarder une entrée dans un établissement d'hébergement. Quel est l’intérêt de faire appel à un SSIAD ?Les équipes des SSIAD sont composées d’aides-soignants et d’infirmiers. Ces professionnels réalisent, selon leurs compétences, à la fois des soins de nursing (toilette…) et des actes infirmiers (pansements, distribution des médicaments, injections…).Le SSIAD assurent également une coordination avec les autres intervenants médicaux et para-médicaux (services d'aide à domicile, kinésithérapeutes, médecins…) dans le but d’améliorer l’accompagnement global de la personne. Comment les interventions se mettent-elles en place ?Les interventions des SSIAD sont possibles s’il y a une prescription médicale.Si vous avez une prescription médicale, vous pouvez prendre contact directement avec un SSIAD situé près de chez vous. Pour trouver les coordonnées des SSIAD près de chez vous, consulter l’annuaire des SSIAD. Si le SSIAD est en capacité d’intervenir, l’infirmier coordonnateur du SSIAD réalise une évaluation des besoins à votre domicile. A l’issue de la visite, il vous propose un rythme d’interventions. Ces interventions peuvent être de courte, de moyenne ou de longue durée selon votre état de santé et vos besoins.Les SSIAD interviennent 7 jours sur 7 si nécessaire. A noter : les interventions des SSIAD sont intégralement prises en charge par l’Assurance maladie. Vous n’avez pas d’avance de frais à faire. ", "type": "accompagnement", "thematiques": "['sante--acces-aux-soins']", "publics": "['beneficiaires-des-minimas-sociaux', 'demandeurs-emploi', 'personnes-en-situation-de-handicap', 'seniors']", "commune": "Janzé", "code_postal": "35150", "code_insee": "35136", "adresse": "9 Rue Clément Ader", "lien_source": "https://annuaire.ille-et-vilaine.fr/organisme/2607-service-de-soins-infirmiers-a-domicile-ssiad-janze", "telephone": "+33299470450", "date_maj": "2021-02-08", "mobilisable_par": "['usagers', 'professionnels']", "modes_mobilisation": "['telephoner']", "zone_eligibilite": "['35']", "score_qualite": "0.75"}], [48.093553, -1.646299, {"id": "cd35--1771--accompagnement-educatif", "structure_id": "cd35--1771", "source": "cd35", "nom": "Accompagnement éducatif", "description": "Les Maisons d'Enfants à Caractère Social (MECS) accueillent les enfants dont les familles se trouvent en difficulté momentanée ou qui ne peuvent assumer de manière continue l'éducation de l'enfant. Les enfants qui y séjournent sont confiés par le service de l'aide sociale à l'enfance ou directement par le juge des enfants, sous réserve que l'établissement ait été spécialement habilité par celui-ci au titre de l'assistance éducative. Le SAP est rattaché à la Maison de l'enfance, Carcé, 35170 Bruz,Etablissement géré par les P.E.P 35. Mixte 6/21ans", "type": "accompagnement", "thematiques": "['famille--soutien-a-la-parentalite-et-a-leducation']", "publics": "['actifs', 'beneficiaires-des-minimas-sociaux', 'demandeurs-emploi', 'familles']", "commune": "Rennes", "code_postal": "35200", "code_insee": "35238", "adresse": "8 Rue de Bel-Air", "horaires_accueil": "9h-20h.", "lien_source": "https://annuaire.ille-et-vilaine.fr/organisme/1771-service-daccompagnement-personnalise-rennes", "telephone": "+33223300708", "date_maj": "2020-02-06", "mobilisable_par": "['usagers', 'professionnels']", "modes_mobilisatio uite", "description": "Au service de toutes les familles et reconnue d'utilité publique, l’Union Départementale des Associations Familiales d'Ille-et-Vilaine (UDAF35) a pour missions de donner des avis aux pouvoirs publics sur les questions d'ordre familial, de représenter les intérêts matériels et moraux des familles et de gérer des services d'intérêt familial.L'UDAF assure la gestion de services d’intérêt familial : \" Questions de Parents \",\" Médiation familiale\", \"la Marmite des mots\", service d'accès aux droits, l'observatoire départemental des familles, service de la médaille française de la famille,\" Les Savoirs Solidaires (lutte contre l'illettrisme), entre autres.L'UDAF est agréée pour agir en justice.Services gérés par l’UDAF :\"Questions de parents\", un service de soutien aux parents : Tél. 02 30 03 95 60 : accueil UDAF35 – mail :  questionsdeparents@udaf35.fr Consultations parentalité :Des entretiens pour toutes questions relatives aux enfants. Un premier rendez-vous gratuit, les suivants en participation libre.Les psychologues spécialistes de la relation parents-enfants vous reçoivent le lundi matin, mardi, jeudi après-midi et vendredi.Consulation Stop Harcèlement :une consultation spécifique au harcèlement en milieu scolaire pour les enfants/jeunes (victimes, auteurs, témoins) et leurs familles.Les psychologues vous reçoivent le mercredi et le jeudi matin. Mais aussi des entretiens de soutiens pour leurs parents le lundi après-midi, une semaine sur 2. \"la Marmite des mots\" :Il s'agit d'un atelier réparti sur 4 demi-journées pour les enfants ou adolescents dont les parents sont séparés, animé par un psychologue et un médiateur.Inscriptions et renseignements : secretariatqdp@udaf35.frSoutien à la parentalité numérique :Les pratiques numériques de votre enfant vous inquiètent et vous ne savez pas comment gérer le sujet à la maison.Nous pouvons vous accompagner.La Maison des familles :La Maison des familles est un lieu d’accueil convivial dédié au <script>
function themeEffectif(){
  return document.documentElement.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function urlFond(theme){
  return "https://{s}.basemaps.cartocdn.com/" + (theme==="dark"?"dark_all":"light_all") + "/{z}/{x}/{y}{r}.png";
}

const D=JSON.parse(document.getElementById("d").textContent);
document.title=D.nom;
document.getElementById("titre").textContent=D.nom;

const map=L.map("carte");
let fond=L.tileLayer(urlFond(themeEffectif()),{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains:"abcd",maxZoom:19
}).addTo(map);

(function(){
  const btn = document.getElementById("theme-toggle");
  function majIcone(){ btn.textContent = themeEffectif() === "dark" ? "☀️" : "🌙"; }
  btn.addEventListener("click", () => {
    const suivant = themeEffectif() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", suivant);
    try { localStorage.setItem("theme", suivant); } catch(e) {}
    map.removeLayer(fond);
    fond = L.tileLayer(urlFond(suivant),{
      attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains:"abcd",maxZoom:19
    }).addTo(map);
    majIcone();
  });
  majIcone();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (!document.documentElement.getAttribute("data-theme")) majIcone();
  });
})();

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function mkPopup(props){
  if(!props||!Object.keys(props).length)return"";
  const rows=Object.entries(props).filter(([,v])=>v!=null&&v!=="").slice(0,30)
    .map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(String(v).slice(0,300))}</td></tr>`).join("");
  return`<table>${rows}</table>`;
}

const PT={radius:7,color:"#0b6e99",weight:1.5,fillColor:"#1a8bbf",fillOpacity:.75};

function ajouterPoints(pts){
  pts.forEach(([lat,lon,props])=>L.circleMarker([lat,lon],PT).bindPopup(mkPopup(props)).addTo(map));
}
function ajouterGeoJSON(features){
  L.geoJSON({type:"FeatureCollection",features},{
    style:{color:"#0b6e99",weight:2,fillColor:"#1a8bbf",fillOpacity:.35},
    pointToLayer:(_,ll)=>L.circleMarker(ll,PT),
    onEachFeature:(f,lyr)=>{if(f.properties)lyr.bindPopup(mkPopup(f.properties));}
  }).addTo(map);
}

// Chargement initial : premiers 5 000 seulement
const BATCH=5000;
let layer;
if(D.type==="points"){
  layer=L.featureGroup(D.points.slice(0,BATCH).map(([lat,lon,props])=>
    L.circleMarker([lat,lon],PT).bindPopup(mkPopup(props))
  )).addTo(map);
}else{
  layer=L.geoJSON({type:"FeatureCollection",features:D.geojson.features.slice(0,BATCH)},{
    style:{color:"#0b6e99",weight:2,fillColor:"#1a8bbf",fillOpacity:.35},
    pointToLayer:(_,ll)=>L.circleMarker(ll,PT),
    onEachFeature:(f,lyr)=>{if(f.properties)lyr.bindPopup(mkPopup(f.properties));}
  }).addTo(map);
}
try{const b=layer.getBounds();if(b.isValid())map.fitBounds(b.pad(0.1));else map.setView([48.1,-1.68],11);}
catch{map.setView([48.1,-1.68],11);}

// Toutes les données sont embarquées dans D — pas de fetch nécessaire
const allItems = D.type==="geojson" ? D.geojson.features : D.points;
let offset = Math.min(BATCH, allItems.length);  // rendu initial

function majInfo(){
  const n=offset, tot=D.nb_total;
  document.getElementById("info").textContent=
    n<tot ? `${n.toLocaleString("fr")} / ${tot.toLocaleString("fr")} éléments`
          : `${n.toLocaleString("fr")} élément${n>1?"s":""}`;
}
function majBouton(){
  const btn=document.getElementById("btn-plus");
  const restant=allItems.length-offset;
  if(restant<=0){btn.style.display="none";return;}
  btn.style.display="";
  btn.textContent=`Afficher 5 000 de plus (${restant.toLocaleString("fr")} restants)`;
}

function chargerPlus(){
  const batch=allItems.slice(offset, offset+BATCH);
  if(D.type==="geojson") ajouterGeoJSON(batch); else ajouterPoints(batch);
  offset+=batch.length;
  majInfo(); majBouton();
}

majInfo();
if(D.tronque) majBouton();
</script>
</body>
</html>
