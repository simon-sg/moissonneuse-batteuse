ele Di Matteo, Tania Mouraud, Aurelie Nemours, Vera Molnar, Yvan Salomone, Malick Sidibé, Yves Trémorin, Jacques Villeglé, Didier Vermeiren. Le Frac Bretagne bénéficie en outre d’importants dépôts, notamment celui de l’oeuvre de Gilles Mahé. En 2012, le Frac Bretagne s’est installé à Rennes, dans un bâtiment signé Odile Decq doté d’espaces d’exposition, de médiation, de documentation et de conservation.", "Lieu: Site internet": "http://www.fracbretagne.fr", "Conditions de participation: Gratuit": "Gratuit", "Conditions de participation: Sans réservation": "Sans réservation", "Type de public: Tout public": "Tout public", "État: Programmé": "Programmé"}], [48.130701, -1.695711, {"Identifiant": "66840833", "Nom de l’événement - FR": "Exposition \"Invisibles\"", "Description courte - FR": "Dans la série britannique The Invisible Man (1958), le physicien Peter Brady devient accidentellement invisible à la suite d’une expérience. Contraint de se bander le visage pour exister aux yeux des…", "Description longue - FR": "Dans la série britannique The Invisible Man (1958), le physicien Peter Brady devient accidentellement invisible à la suite d’une expérience. Contraint de se bander le visage pour exister aux yeux des autres, il choisit pourtant d’utiliser cette disparition comme une force d’action. Moins visible, mais tout aussi agissant, il opte pour une forme d’intervention discrète, souterraine et détachée du spectaculaire.  Cette exposition prend appui sur cette idée d’une présence en creux, en écho à la notion de fugitivité développée par le poète et penseur Fred Moten. Chez lui, il ne s’agit pas d’un retrait mais du refus de se laisser capturer par les normes dominantes. La personne fugitive invente des formes de vie collectives et improvisées depuis les marges, en résistant sans se dévoiler. Être invisible, c’est parfois survivre autrement, créer depuis l’ombre, soigner depuis la périphérie.  Les invisibilités abordées ici sont aussi bien sociales que politiques ou écologiques. Elles affectent une large majorité de la population mondiale reléguée aux marges de la société et à l’arrière-plan des représentations en raison de leur genre, origine, condition sociale, santé, âge, entre autres.  Ces invisibilisations subies engendrent bien souvent un repli sur soi et parfois même une haine de l’autre. Pourtant, ne perdons jamais de vue que ce ne sont pas les différences en elles-mêmes qui alimentent les tensions à l’œuvre dans notre société contemporaine mais bien la violence diffuse d’une gouvernance politique et économique qui fragilise les solidarités, instrumentalise les diversités, et oppose les personnes pour mieux perpétuer les inégalités.  L’exposition explore les formes de disparition imposée des corps, des voix, des territoires et met en lumière ce qui persiste dans les marges : des gestes discrets, des présences fragmentaires, des récits étouffés. D’autres manières, peut-être, d’habiter le monde.", "Permalien": "https://openagenda.com/agendas/2883956/events/66840833", "Résumé horaires - FR": "20 et 21 septembre", "Horaires ISO": "2025-09-20T12:00:00+02:00 -> 2025-09-20T19:00:00+02:00 | 2025-09-21T12:00:00+02:00 -> 2025-09-21T19:00:00+02:00", "Horaires détaillés - FR": "samedi 20 septembre 2025 - 12:00 ⤏ 19:00 | dimanche 21 septembre 2025 - 12:00 ⤏ 19:00", "Première date - FR": "samedi 20 septembre 2025", "Dernière date - FR": "dimanche 21 septembre 2025", "Détail des conditions de participation - FR": "Gratuit, sans réservation, dans la limite des places disponibles.", "Accessibilité - FR": "Handicap intellectuel | Handicap auditif | Handicap psychique | Handicap moteur", "Création de la fiche - FR": "lundi 1 septembre 2025", "Dernière mise à jour - FR": "jeudi 4 septembre 2025", "Image": "https://cdn.openagenda.com/main/6d92b2b1a48e443496d309bdc2b94269.base.image.jpg", "Statut": "Publié", "Types d'événement: Exposition": "Exposition", "Crédits de l'image": "création graphique : DeValence", "J’accepte que l’image puisse être s des Ateliers du Vent et leurs invité·es !Fanny Bouffort, Marine Bouilloud, Estelle Chaigne, Grégory Delauré, Coline Duval, Catherine Duverger, Lise Gaudaire, Élise Guihard, Hugo Kostrzewa, Matthieu Marques Duarte, Anna Mermet, Nawal Aïssou (artiste invitée, plateforme), Charlotte Beltzung (artiste invitée, container jaune).*   Et les artisan·es du Mur Habité :Atelier RKcours de couture, Marie Martin Mosaïque, Atelier Calypso, Reliure Messager.  **Samedi : visite des Ateliers du Vent**  \\- 14h + 16h : venez découvrir le lieu et l’histoire des Ateliers du Vent lors de visites avec la coordinatrice  Durée 1h • [Gratuit sur billetterie](https://www.helloasso.com/associations/les-ateliers-du-vent/evenements/visite-des-ateliers-du-vent-ateliers-portes-ouvertes-2025)  **Samedi : impromptus**  \\- _15h15_ : Reappearing • Mitch Fournial  Performance sonore, 25 min • Plateforme  Il est ici question d’interroger les phénomènes d’apparition et de disparition à travers une performance centrée sur l’écoute du paysage sonore. Inspirée par la relation sensorielle à l’eau dans les bains publics japonais, elle met en jeu un protocole de disparition symbolique du poids en eau. Goutte à goutte, s’opère une métamorphose en une entité hybride, à la fois aquatique et humaine, suspendue entre dissolution et réinvention de la présence.  — _17h15 + 18h_ : _La locura_ • Matthieu Marques Duarte  Exposition, vidéo et performances, 20min • Plateforme  À travers cette installation vidéo et ces performances, le collectif Tumulus vous emmène dans la matière même du clip La Locura de Marsa. Danseur·euses et musicien·nes y plongent ensemble dans un univers où se mêlent néo-trad et waacking.  Par un geste, un regard, un son, les participant·es se croisent, s’invitent, se découvrent, s’écoutent et composent ensemble ce moment unique qu’est le bal.  Grâce à la sensibilité et l’intensité de la musique de Marsa, iels expriment leur singularité tout en faisant émerger le collectif.  Réalisation : Matthi u: Quartier": "Cleunay - Arsenal-Redon", "Lieu: Code postal": "35000", "Lieu: Code INSEE": "35238", "Lieu: Description - FR": "Des personnes engagées font vivre collectivement une ancienne usine à moutarde : espace de création et de présentation pour les artistes de toutes disciplines, lieu de rencontre et de restauration, endroit de tentatives et d’utopies… un lieu vivant, vivifiant, vibrant, dans le vent.Les Ateliers du Vent cherchent à faire intimement cohabiter deux dimensions : être un espace de travail artistique et un lieu de confrontation culturelle.Le collectif Les Ateliers du Vent est composé de personnes engagées qui font vivre un lieu de création artistique, de rencontre culturelle et d’expérimentations citoyennes. Collectif imaginé et conduit par des artistes de toutes disciplines, c’est aussi une équipe de salarié·es, d’adhérent·es et de bénévoles qui soutiennent et font vivre le projet. Les Ateliers du Vent constituent une expérience en mouvement, basée sur l’innovation artistique et culturelle qui se développe dans le champ de l’économie sociale et solidaire.Laboratoire de recherches variées, l’expérimentation artistique y croise une politique de voisinage qui tend à la convivialité et au brassage des publics. Les usager·ères sont souvent invité·es à participer aux processus artistiques, pouvant intervenir directement ou découvrant des présentations de travaux en cours. —Le lieu est ouvert à des horaires, périodes, endroits et occasions multiples, lors d’expositions, de concerts, de représentations théâtrales, de festivals, de rencontres… Et lors de rendez-vous réguliers :—> Au bar : tous les jeudis et les vendredis soir à partir de 18h (scène ouverte les jeudis à la Buvette )—> À la table de Passages : du lundi au vendredi de 12h à 14h—> Lors de la visite mensuelle : chaque 2ème mercredi du mois à 14h, menée par Juliette Josselin, la coordinatrice du lieu.", "Lieu: Site internet": "https://www.lesateliersduvent.org/", "Lieu: Accès - FR": "Accès : mé sible, incarne une figure ambivalente : victime d’une expérience scientifique, il découvre dans sa condition d’invisibilité une nouvelle manière d’agir et d’exister en marge, en échappant aux regards dominants.  À partir de cette figure fictionnelle, l’exposition puise dans les collections du Frac Bretagne pour interroger les formes contemporaines d’invisibilisation — sociales, raciales, politiques ou encore écologiques — et les stratégies qui permettent d’exister autrement, dans les interstices du visible.", "Permalien": "https://openagenda.com/agendas/2883956/events/45614561", "Mots clés - FR": "exposition | visite | frac | art contemporain", "Résumé horaires - FR": "20 et 21 septembre", "Horaires ISO": "2025-09-20T14:00:00+02:00 -> 2025-09-20T14:30:00+02:00 | 2025-09-20T16:00:00+02:00 -> 2025-09-20T16:30:00+02:00 | 2025-09-20T18:00:00+02:00 -> 2025-09-20T18:30:00+02:00 | 2025-09-21T14:00:00+02:00 -> 2025-09-21T14:30:00+02:00 | 2025-09-21T16:00:00+02:00 -> 2025-09-21T16:30:00+02:00 | 2025-09-21T18:00:00+02:00 -> 2025-09-21T18:30:00+02:00", "Horaires détaillés - FR": "samedi 20 septembre 2025 - 14:00 ⤏ 14:30, 16:00 ⤏ 16:30, 18:00 ⤏ 18:30 | dimanche 21 septembre 2025 - 14:00 ⤏ 14:30, 16:00 ⤏ 16:30, 18:00 ⤏ 18:30", "Première date - FR": "samedi 20 septembre 2025", "Dernière date - FR": "dimanche 21 septembre 2025", "Détail des conditions de participation - FR": "Durée de la visite : 30 min  Gratuit, réservations sur place, dans la limite des places disponibles", "Accessibilité - FR": "Handicap intellectuel | Handicap auditif | Handicap psychique | Handicap moteur", "Création de la fiche - FR": "mercredi 3 septembre 2025", "Dernière mise à jour - FR": "lundi 8 septembre 2025", "Image": "https://cdn.openagenda.com/main/ec98f306d23f4ca0b8a35b7e034130d2.base.image.jpg", "Statut": "Publié", "Types d'événement: Visite commentée": "Visite commentée", "Crédits de l'image": "Frac Bretagne", "J’accepte que l’image puisse être librement utilisée, à la condition de l'attribuer à en. Le Frac Bretagne bénéficie en outre d’importants dépôts, notamment celui de l’oeuvre de Gilles Mahé. En 2012, le Frac Bretagne s’est installé à Rennes, dans un bâtiment signé Odile Decq doté d’espaces d’exposition, de médiation, de documentation et de conservation.", "Lieu: Site internet": "http://www.fracbretagne.fr", "Conditions de participation: Gratuit": "Gratuit", "Conditions de participation: Sans réservation": "Sans réservation", "Type de public: Tout public": "Tout public", "État: Programmé": "Programmé"}], [48.0932, -1.664838, {"Identifiant": "50646862", "Nom de l’événement - FR": "Visite libre du Parc des Ecotais", "Description courte - FR": "Déambulation libre dans le parc.", "Description longue - FR": "Déambulation libre dans le parc.", "Permalien": "https://openagenda.com/agendas/2883956/events/50646862", "Résumé horaires - FR": "Dimanche 21 septembre, 14h30", "Horaires ISO": "2025-09-21T14:30:00+02:00 -> 2025-09-21T18:30:00+02:00", "Horaires détaillés - FR": "dimanche 21 septembre 2025 - 14:30 ⤏ 18:30", "Première date - FR": "dimanche 21 septembre 2025", "Dernière date - FR": "dimanche 21 septembre 2025", "Création de la fiche - FR": "jeudi 14 août 2025", "Dernière mise à jour - FR": "vendredi 5 septembre 2025", "Image": "https://cdn.openagenda.com/main/cc224f163cc74d91b9e157b1211659e0.base.image.jpg", "Statut": "Publié", "Types d'événement: Visite libre": "Visite libre", "Spécificités: Ouverture exceptionnelle": "Ouverture exceptionnelle", "Crédits de l'image": "Indivision Carof", "J’accepte que l’image puisse être librement utilisée, à la condition de l'attribuer à l'auteur en citant son nom, et partagée dans les mêmes conditions.": "true", "Mode de participation: Sur place": "Sur place", "Lieu: Types de lieu: Espace naturel, parc, jardin": "Espace naturel, parc, jardin", "Lieu: Identifiant": "12283542", "Lieu: Nom": "Parc des Ecotais", "Lieu: Adresse": "rue Cécile Brunschvicg 35200 Rennes", "Lieu: Code pays": "FR", "Lieu: Région": "Bretagne", "L irmés aux créateurs émergents, ainsi qu’entre les différentes scènes, locales, régionales, et internationales. Parmi les orientations de la collection, l’abstraction et les relations de l’art et du paysage tiennent une place majeure. Les artistes face à l’histoire, les différents régimes de l’image dans la création contemporaine, sont également des axes forts, de même que la volonté de constituer des ensembles monographiques conséquents, tels ceux de Iain Baxter, Raymond Hains, Gabriele Di Matteo, Tania Mouraud, Aurelie Nemours, Vera Molnar, Yvan Salomone, Malick Sidibé, Yves Trémorin, Jacques Villeglé, Didier Vermeiren. Le Frac Bretagne bénéficie en outre d’importants dépôts, notamment celui de l’oeuvre de Gilles Mahé. En 2012, le Frac Bretagne s’est installé à Rennes, dans un bâtiment signé Odile Decq doté d’espaces d’exposition, de médiation, de documentation et de conservation.", "Lieu: Site internet": "http://www.fracbretagne.fr", "Conditions de participation: Gratuit": "Gratuit", "Conditions de participation: Sans réservation": "Sans réservation", "Type de public: Enfants (0-15 ans)": "Enfants (0-15 ans)", "État: Programmé": "Programmé"}], [48.105313, -1.674877, {"Identifiant": "95202891", "Nom de l’événement - FR": "Visite des réserves du Musée de Bretagne", "Description courte - FR": "Le Musée de Bretagne ouvre exceptionnellement les portes de ses réserves et vous invite à découvrir les coulisses des collections.", "Description longue - FR": "Près d’un million d’objets et de documents sont conservés dans les réserves du musée. De la réserve des textiles aux arts graphiques, en passant par la photographie, découvrez ces espaces habituellement fermés au public.", "Permalien": "https://openagenda.com/agendas/2883956/events/95202891", "Mots clés - FR": "jemp", "Résumé horaires - FR": "Dimanche 21 septembre, 14h15, 15h45, 17h15", "Horaires ISO": "2025-09-21T14:15:00+02:00 -> 2025-09-21T15:15:00+02:00 | 2025-09-21T15:45:00+02:00 -> 2025-09-21T16:45:00+02:00 | 2025 s de brais de Vieux Vy sur Couesnon. Chaque concert de la tournée est pensé comme une immersion dans la mémoire des lieux à travers une découverte du site et des actions de médiation auprès des publics. Oscillant entre chanson, trip-hop et sonorités industrielles, François Audrain pose sa voix avec douceur sur des mélodies rock aux contrastes assumés, claires et obscures à la fois. Dans une forme à la fois intimiste et puissante, Melancholia fait résonner les récits enfouis de ceux qu’on appelait les « petites gens » — ouvriers, travailleurs, figures anonymes dont les vies ont façonné notre patrimoine.  François Audrain : voix, guitares  David Euverte : claviers  David Monceau : samples, machines, guitare  Daniel Paboeuf : saxophone baryton  Nicolas Courret : batterie  Partenariats : Département d’Ille-et-Vilaine, commune de Louvigné du désert, Communauté de communes de Val d’Ille Aubigné, commune de Vieux Vy sur Couesnon. Dimanche à Rennes - Tombées de la nuit.", "Permalien": "https://openagenda.com/agendas/2883956/events/18753925", "Résumé horaires - FR": "Dimanche 21 septembre, 17h00", "Horaires ISO": "2025-09-21T17:00:00+02:00 -> 2025-09-21T18:00:00+02:00", "Horaires détaillés - FR": "dimanche 21 septembre 2025 - 17:00 ⤏ 18:00", "Première date - FR": "dimanche 21 septembre 2025", "Dernière date - FR": "dimanche 21 septembre 2025", "Création de la fiche - FR": "mercredi 23 juillet 2025", "Dernière mise à jour - FR": "vendredi 25 juillet 2025", "Image": "https://cdn.openagenda.com/main/2ddbca9ceb5148118f38371f2bcf5fdf.base.image.jpg", "Statut": "Publié", "Types d'événement: Concert": "Concert", "Crédits de l'image": "crédit photo  Emmanuel Pain", "J’accepte que l’image puisse être librement utilisée, à la condition de l'attribuer à l'auteur en citant son nom, et partagée dans les mêmes conditions.": "true", "Mode de participation: Sur place": "Sur place", "Lieu: Types de lieu: Archives": "Archives", "Lieu: Identifiant": "78599250", "Lieu: Nom": "Archives départeme pe grâce au livret disponible à l’accueil (idéal dès 12 ans, environ 30 minutes). Les plus téméraires pourront tester l’escape room sous tente militaire : parviendrez-vous à vous échapper en moins de 30 minutes ? (prévu pour 4 à 5 joueurs, à partir de 12 ans, durée totale 40 minutes).Le programme se poursuit avec la Crypto Fresque, une œuvre codée éphémère où chacun peut écrire son message secret et tenter de déchiffrer ceux des autres visiteurs. À l’extérieur, une exposition de véhicules militaires (Griffon et station Astride) ainsi qu’un espace d’essayage d’uniformes vous attendent pour une immersion grandeur nature. Temps fort du week-end : la table ronde “Cybersécurité : Menace ou fatalité ?” aura lieu le dimanche 21 septembre à 14h30 dans l’amphithéâtre (à gauche après l’accueil).Un food truck sera présent jusqu’à 16h pour vos pauses gourmandes, et vous pourrez également découvrir en exclusivité notre nouvelle boutique .", "Permalien": "https://openagenda.com/agendas/2883956/events/30990334", "Résumé horaires - FR": "20 et 21 septembre", "Horaires ISO": "2025-09-20T10:00:00+02:00 -> 2025-09-20T18:00:00+02:00 | 2025-09-21T10:00:00+02:00 -> 2025-09-21T18:00:00+02:00", "Horaires détaillés - FR": "samedi 20 septembre 2025 - 10:00 ⤏ 18:00 | dimanche 21 septembre 2025 - 10:00 ⤏ 18:00", "Première date - FR": "samedi 20 septembre 2025", "Dernière date - FR": "dimanche 21 septembre 2025", "Détail des conditions de participation - FR": "parking gratuit", "Création de la fiche - FR": "mardi 15 juillet 2025", "Dernière mise à jour - FR": "jeudi 11 septembre 2025", "Image": "https://cdn.openagenda.com/main/a263db71bb8c42518e8560157750915c.base.image.jpg", "Statut": "Publié", "Types d'événement: Exposition": "Exposition", "Crédits de l'image": "SMDMuséedestransmissions", "J’accepte que l’image puisse être librement utilisée, à la condition de l'attribuer à l'auteur en citant son nom, et partagée dans les mêmes conditions.": "true", "Mode de participation: Sur place": "Sur pl es Carmes, aujourd’hui Église du Thabor.", "Description longue - FR": "nous proposons de mettre en lumière une autre dimension primordiale de notre édifice : la restauration de la chapelle des Carmes, aujourd’hui Église du Thabor.Cette chapelle, construite dans un style néo-gothique entre 1860 et 1867 (bénie le 5 avril 1867) , constitue le seul vestige du couvent des Carmes déchaussés de Rennes. Elle a traversé plusieurs destins — collège, hôpital, cantine, même lieu de culte durant l’Occupation — avant d’être laissée à l’abandon  Acquise en 1998 par la Communauté évangélique, sa rénovation a duré de 2002 à 2015Ce chantier monumental a été essentiellement porté par des bénévoles motivés, cumulant plus de 13 années de travaux pour plus de 60 000 heures investiesAncienne chapelle des Carmes, devenue Église du Thabor, ce lieu a retrouvé vie grâce aux mains patientes et au cœur généreux de bénévoles. Plus de treize années de restauration ont transformé ces pierres oubliées en un sanctuaire vivant, ouvert au culte et à la culture. Un patrimoine sauvé, offert à tous, comme une mémoire qui respire encore.Grâce à cet engagement, la chapelle renaît pleinement : accueillant désormais le culte, elle ouvre aussi ses portes à la culture — concerts, conférences, récitals — dans un lieu qui allie spiritualité et patrimoineSous la lumière douce des vitraux, le parcours met également en évidence les éléments architecturaux remarquables de l’édifice : lignes sobres et verticales, mobilier liturgique, vitraux colorés et baptistère, qui témoignent de l’esthétique protestante et de son attachement à la simplicité et à la lumière. Les visiteurs pourront ainsi apprécier la richesse d’un patrimoine où se rencontrent héritage spirituel, histoire locale et expression artistique.  Site internet qui explique : [https://www.ouest-france.fr/bretagne/rennes-35000/la-chapelle-des-carmes-renait-au-culte-chretien-3202370](https://www.ouest-france.fr/bretagne/rennes-35000/la-chapelle-des-carmes-renait-au-culte-chretien-3202370)  [https://fr.wikipedia.org/wiki/Chapelle\\_des\\_Carmes\\_(Rennes)](https://fr.wikipedia.org/wiki/Chapelle_des_Carmes_(Rennes))", "Permalien": "https://openagenda.com/agendas/2883956/events/54145923", "Résumé horaires - FR": "20 et 21 septembre", "Horaires ISO": "2025-09-20T14:00:00+02:00 -> 2025-09-20T18:00:00+02:00 | 2025-09-21T14:00:00+02:00 -> 2025-09-21T18:00:00+02:00", "Horaires détaillés - FR": "samedi 20 septembre 2025 - 14:00 ⤏ 18:00 | dimanche 21 septembre 2025 - 14:00 ⤏ 18:00", "Première date - FR": "samedi 20 septembre 2025", "Dernière date - FR": "dimanche 21 septembre 2025", "Accessibilité - FR": "Handicap intellectuel | Handicap visuel | Handicap psychique | Handicap moteur", "Création de la fiche - FR": "samedi 21 juin 2025", "Dernière mise à jour - FR": "mardi 9 septembre 2025", "Image": "https://cdn.openagenda.com/main/48536b8e58354f44a21340373f97a6b2.base.image.jpg", "Statut": "Publié", "Types d'événement: Visite commentée": "Visite commentée", "Thèmes 2025: Patrimoine architectural": "Patrimoine architectural", "Crédits de l'image": "@eglisedu thabor", "J’accepte que l’image puisse être librement utilisée, à la condition de l'attribuer à l'auteur en citant son nom, et partagée dans les mêmes conditions.": "true", "Mode de participation: Sur place": "Sur place", "Lieu: Types de lieu: Archives": "Archives", "Lieu: Types de lieu: Édifice religieux": "Édifice religieux", "Lieu: Identifiant": "53962844", "Lieu: Nom": "Eglise protestante évangélique du Thabor", "Lieu: Adresse": "13 Rue Martenot, 35000 Rennes", "Lieu: Code pays": "FR", "Lieu: Région": "Bretagne", "Lieu: Département": "Ille-et-Vilaine", "Lieu: Ville": "Rennes", "Lieu: Arrondissement": "Thabor - Saint-Hélier - Alphonse Guérin", "Lieu: Quartier": "Thabor - Saint-Hélier - Alphonse Guérin", "Lieu: Code postal": "35000", "Lieu: Code INSEE": "35238", "Lieu: Description - FR": "L'église du Thabor est l'ancienne chapelle du couvent des Carmes déchaussés de Rennes, co agne", "Lieu: Département": "Ille-et-Vilaine", "Lieu: Ville": "Rennes", "Lieu: Arrondissement": "Villejean - Beauregard", "Lieu: Quartier": "Villejean - Beauregard", "Lieu: Code postal": "35000", "Lieu: Code INSEE": "35238", "Lieu: Description - FR": "Premier né des Fonds régionaux d’art contemporain, le Frac Bretagne a été créé en 1981 à l’initiative du ministère de la Culture et de la Région Bretagne. Il a pour objectifs de soutenir et promouvoir la création contemporaine, lui permettre d’être présente sur l’ensemble du territoire régional et sensibiliser les publics les plus divers à l’art d’aujourd’hui. Sa mission principale est de constituer une collection d’art contemporain, dont il assure la diffusion à l’échelle régionale, nationale et internationale. La collection du Frac Bretagne est l’une des plus riches au plan national : en 2016, elle compte plus de 5 000 œuvres de plus de 600 artistes. Depuis l’origine, elle se construit avec une double volonté de cohérence et d’ouverture par la recherche d’un équilibre entre les générations – des artistes confirmés aux créateurs émergents, ainsi qu’entre les différentes scènes, locales, régionales, et internationales. Parmi les orientations de la collection, l’abstraction et les relations de l’art et du paysage tiennent une place majeure. Les artistes face à l’histoire, les différents régimes de l’image dans la création contemporaine, sont également des axes forts, de même que la volonté de constituer des ensembles monographiques conséquents, tels ceux de Iain Baxter, Raymond Hains, Gabriele Di Matteo, Tania Mouraud, Aurelie Nemours, Vera Molnar, Yvan Salomone, Malick Sidibé, Yves Trémorin, Jacques Villeglé, Didier Vermeiren. Le Frac Bretagne bénéficie en outre d’importants dépôts, notamment celui de l’oeuvre de Gilles Mahé. En 2012, le Frac Bretagne s’est installé à Rennes, dans un bâtiment signé Odile Decq doté d’espaces d’exposition, de médiation, de documentation et de conservation.", "Lieu: Site internet": "http: rtagée dans les mêmes conditions.": "true", "Mode de participation: Sur place": "Sur place", "Lieu: Protections, appellation et labels: Monument historique": "Monument historique", "Lieu: Types de lieu: Édifice industriel, scientifique et technique": "Édifice industriel, scientifique et technique", "Lieu: Identifiant": "45774903", "Lieu: Nom": "Mine de plomb argentifère de Pont-Péan", "Lieu: Adresse": "Eglise, 2 rue de la Mine, 35131 Pont-Péan", "Lieu: Code pays": "FR", "Lieu: Région": "Bretagne", "Lieu: Département": "Ille-et-Vilaine", "Lieu: Ville": "Pont-Péan", "Lieu: Quartier": "Tellé", "Lieu: Code postal": "35131", "Lieu: Code INSEE": "35363", "Lieu: Description - FR": "Cette mine de plomb, inaugurée en 1730, qui exploitait un ensemble de quatre veines métallifères, a gardé des traces des premiers chantiers, notamment la partie supérieure du Puits des Députés. Elle fut exploitée d'abord par une société fondée par l'armateur malouin Danycan de L'Epine et reprise en 1755 par le financier Pâris-Duverney. La mine travailla d'abord avec un chapelet à 80 seaux, puis l'ingénieur Laurent poussa l'extraction jusqu'à 120 m (1794). En 1757, 1 000 ouvriers travaillaient sur place. Après une longue interruption, principalement due aux difficultés soulevées par les infiltrations de la Seiche, la relance se fit en 1844 sous l'impulsion de l'ingénieur anglais J. Hunt. La production fut accrue, grâce à de nouveaux systèmes de pompes (puits Bicêtre et puits allemand). En 1853, fut créée la Société pour l'exploitation des mines de Pont-Péan, société en commandite à capitaux majoritairement anglais. Plusieurs modèles de machines à vapeur se succédèrent, et, en 1893, on en comptait 18 sur l'ensemble du site minier. Devenue société anonyme en 1880, sous l'impulsion d'E. Le Bastard et de l'ingénieur belge C. Hely, sa production annuelle atteignait à la fin du 19e siècle les 200 000 tonnes de minerai. La mine a finalement cessé toute activité en 1905.", "Lieu: Site internet": "http:// retagne", "Lieu: Adresse": "19 avenue André Mussat, 35000 Rennes, France", "Lieu: Code pays": "FR", "Lieu: Région": "Bretagne", "Lieu: Département": "Ille-et-Vilaine", "Lieu: Ville": "Rennes", "Lieu: Arrondissement": "Villejean - Beauregard", "Lieu: Quartier": "Villejean - Beauregard", "Lieu: Code postal": "35000", "Lieu: Code INSEE": "35238", "Lieu: Description - FR": "Premier né des Fonds régionaux d’art contemporain, le Frac Bretagne a été créé en 1981 à l’initiative du ministère de la Culture et de la Région Bretagne. Il a pour objectifs de soutenir et promouvoir la création contemporaine, lui permettre d’être présente sur l’ensemble du territoire régional et sensibiliser les publics les plus divers à l’art d’aujourd’hui. Sa mission principale est de constituer une collection d’art contemporain, dont il assure la diffusion à l’échelle régionale, nationale et internationale. La collection du Frac Bretagne est l’une des plus riches au plan national : en 2016, elle compte plus de 5 000 œuvres de plus de 600 artistes. Depuis l’origine, elle se construit avec une double volonté de cohérence et d’ouverture par la recherche d’un équilibre entre les générations – des artistes confirmés aux créateurs émergents, ainsi qu’entre les différentes scènes, locales, régionales, et internationales. Parmi les orientations de la collection, l’abstraction et les relations de l’art et du paysage tiennent une place majeure. Les artistes face à l’histoire, les différents régimes de l’image dans la création contemporaine, sont également des axes forts, de même que la volonté de constituer des ensembles monographiques conséquents, tels ceux de Iain Baxter, Raymond Hains, Gabriele Di Matteo, Tania Mouraud, Aurelie Nemours, Vera Molnar, Yvan Salomone, Malick Sidibé, Yves Trémorin, Jacques Villeglé, Didier Vermeiren. Le Frac Bretagne bénéficie en outre d’importants dépôts, notamment celui de l’oeuvre de Gilles Mahé. En 2012, le Frac Bretagne s’est installé à Rennes, dans un bâtiment signé O  Ville": "Rennes", "Lieu: Arrondissement": "Villejean - Beauregard", "Lieu: Quartier": "Villejean - Beauregard", "Lieu: Code postal": "35000", "Lieu: Code INSEE": "35238", "Lieu: Description - FR": "Premier né des Fonds régionaux d’art contemporain, le Frac Bretagne a été créé en 1981 à l’initiative du ministère de la Culture et de la Région Bretagne. Il a pour objectifs de soutenir et promouvoir la création contemporaine, lui permettre d’être présente sur l’ensemble du territoire régional et sensibiliser les publics les plus divers à l’art d’aujourd’hui. Sa mission principale est de constituer une collection d’art contemporain, dont il assure la diffusion à l’échelle régionale, nationale et internationale. La collection du Frac Bretagne est l’une des plus riches au plan national : en 2016, elle compte plus de 5 000 œuvres de plus de 600 artistes. Depuis l’origine, elle se construit avec une double volonté de cohérence et d’ouverture par la recherche d’un équilibre entre les générations – des artistes confirmés aux créateurs émergents, ainsi qu’entre les différentes scènes, locales, régionales, et internationales. Parmi les orientations de la collection, l’abstraction et les relations de l’art et du paysage tiennent une place majeure. Les artistes face à l’histoire, les différents régimes de l’image dans la création contemporaine, sont également des axes forts, de même que la volonté de constituer des ensembles monographiques conséquents, tels ceux de Iain Baxter, Raymond Hains, Gabriele Di Matteo, Tania Mouraud, Aurelie Nemours, Vera Molnar, Yvan Salomone, Malick Sidibé, Yves Trémorin, Jacques Villeglé, Didier Vermeiren. Le Frac Bretagne bénéficie en outre d’importants dépôts, notamment celui de l’oeuvre de Gilles Mahé. En 2012, le Frac Bretagne s’est installé à Rennes, dans un bâtiment signé Odile Decq doté d’espaces d’exposition, de médiation, de documentation et de conservation.", "Lieu: Site internet": "http://www.fracbretagne.fr", "Conditions de participation:  de participation: Réservation obligatoire": "Réservation obligatoire", "Type de public: Adulte": "Adulte", "État: Programmé": "Programmé"}], [48.110768, -1.69391, {"Identifiant": "75287640", "Nom de l’événement - FR": "Marion du Faouët au théâtre", "Description courte - FR": "Une soirée à la redécouverte de notre matrimoine culturel local !", "Description longue - FR": "Une soirée à la redécouverte de notre matrimoine culturel local !  2 août 1755, Marie-Louise Tromel, dite aussi Marie Finefont, connue sous le nom de Marion du Faouët ou la « catin aux cheveux rouges » est pendue à Quimper, place Saint-Corentin. Quels crimes a-t-elle commis ?  Pendant quinze ans, avec la bande de brigands de grands chemins qu'elle dirige, elle a sévi dans toute la Cornouaille: elle a volé des marchands au retour des foires, des artisans, des paysans aisés, des colporteurs. La légende en a fait un Robin-des-Bois féminin. Colette Cosnier en a fait une révoltée, une rebelle, une féministe. Car pour elle, son crime est aussi celui de la liberté et de la révolte.  Cette pièce de Colette Cosnier évoque la vie quotidienne au XVIIIe siècle en Bretagne et aborde les thèmes de la justice, de la liberté, de la place des femmes.Colette Cosnier (La Flèche, 1936 - Rennes, 2016) est une écrivaine et professeure de littérature. Elle nous a laissé des pièces de théâtre, des romans, des essais, des biographies de femmes. En France, elle est la première à avoir, dès 1973, mis en place un cours entièrement consacré aux écrivaines à l'université Rennes 2.Pour fêter la réédition de la pièce de théâtre \"Marion du Faouët, la catin aux cheveux rouges\" de Colette Cosnier aux éditions Goater, l'association Histoire du Féminisme à Rennes et l'ADEC proposent une soirée de rencontre, lectures et surprises. En présence de Brice Evain, Docteur en histoire Moderne à l'Université Rennes 2, et avec la complicité de lectrices et lecteurs amateurs ainsi que de la chorale Les Luttes Enchantées.  _Organisée par l’ADEC- siècle représentant Saint Méen.  La fontaine de Saint-Méen-le-Grand et celle de Vezin sont à classer parmi les fontaines miraculeuses et guérisseuses. Les eaux du Grand Saint Méen sont censées guérir certaines maladies cutanées dont le « mal de Saint Méen », sorte de gale très répandue au Moyen Âge.  On reconnaît aussi à la fontaine de Vezin « des vertus d’intercession contre les maladies de peau et les maladies d’yeux ». La fontaine serait devenue le but d’un pèlerinage par imitation du pèlerinage initial à Saint Méen. Le chemin de pèlerinage vers Saint- Méen-le-Grand passait par Vezin.  À la fin du XVIIIe siècle, la fontaine tombe en disgrâce auprès du clergé qui finit par supprimer le pèlerinage. La fontaine est connue pour ne jamais tarir. Pendant les sécheresses de 1949, 1959 et 1976, les Vezinois sont venus s’y approvisionner en eau.  Sa profondeur est de 3,50 m. C’est une fontaine-puits comme la plupart des fontaines en Bretagne.  _**Vezin Histoire et Patrimoine \\[d’après différentes sources\\] & Mairie de Vezin-le Coquet**_", "Permalien": "https://openagenda.com/agendas/2883956/events/71128816", "Résumé horaires - FR": "Samedi 20 septembre, 15h00", "Horaires ISO": "2025-09-20T15:00:00+02:00 -> 2025-09-20T17:00:00+02:00", "Horaires détaillés - FR": "samedi 20 septembre 2025 - 15:00 ⤏ 17:00", "Première date - FR": "samedi 20 septembre 2025", "Dernière date - FR": "samedi 20 septembre 2025", "Détail des conditions de participation - FR": "RDV : Fontaine Saint Méen – Parc de Boaré", "Création de la fiche - FR": "mardi 8 juillet 2025", "Dernière mise à jour - FR": "vendredi 11 juillet 2025", "Image": "https://cdn.openagenda.com/main/6dfb8ef79e004b7a89872de91d56ce36.base.image.jpg", "Statut": "Publié", "Types d'événement: Visite commentée": "Visite commentée", "Crédits de l'image": "ville de Vezin-le-Coquet", "J’accepte que l’image puisse être librement utilisée, à la condition de l'attribuer à l'auteur en citant son nom, et partagée dans les mêmes conditions.": document.getElementById("titre").textContent=D.nom;

const map=L.map("carte");
let fond=L.tileLayer(urlFond(themeEffectif()),{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains:"abcd",maxZoom:19
}).addTo(map);

(function(){
  const btn = document.getElementById("theme-toggle");
  function majIcone(){ btn.textContent = themeEffectif() === "dark" ? "☀️" : "🌙"; }
  btn.addEventListener("click", () => {
    const suivant = themeEffectif() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", suivant);
    try { localStorage.setItem("theme", suivant); } catch(e) {}
    map.removeLayer(fond);
    fond = L.tileLayer(urlFond(suivant),{
      attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains:"abcd",maxZoom:19
    }).addTo(map);
    majIcone();
  });
  majIcone();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (!document.documentElement.getAttribute("data-theme")) majIcone();
  });
})();

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function mkPopup(props){
  if(!props||!Object.keys(props).length)return"";
  const rows=Object.entries(props).filter(([,v])=>v!=null&&v!=="").slice(0,30)
    .map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(String(v).slice(0,300))}</td></tr>`).join("");
  return`<table>${rows}</table>`;
}

const PT={radius:7,color:"#0b6e99",weight:1.5,fillColor:"#1a8bbf",fillOpacity:.75};

function ajouterPoints(pts){
  pts.forEach(([lat,lon,props])=>L.circleMarker([lat,lon],PT).bindPopup(mkPopup(props)).addTo(map));
}
function ajouterGeoJSON(features){
  L.geoJSON({type:"FeatureCollection",features},{
    style:{color:"#0b6e99",weight:2,fillColor:"#1a8bbf",fillOpacity:.35},
    pointToLayer:(_,ll)=>L.circleMarker(ll,PT),
    onEachFeature:(f,lyr)=>{if(f.properties)lyr.bindPopup(mkPopup(f.properties));}
  }).addTo(map);
}

// Chargement initial : premiers 5 000 seulement
const BATCH=5000;
let layer;
if(D.type==="points"){
  layer=L.featureGroup(D.points.slice(0,BATCH).map(([lat,lon,props])=>
    L.circleMarker([lat,lon],PT).bindPopup(mkPopup(props))
  )).addTo(map);
}else{
  layer=L.geoJSON({type:"FeatureCollection",features:D.geojson.features.slice(0,BATCH)},{
    style:{color:"#0b6e99",weight:2,fillColor:"#1a8bbf",fillOpacity:.35},
    pointToLayer:(_,ll)=>L.circleMarker(ll,PT),
    onEachFeature:(f,lyr)=>{if(f.properties)lyr.bindPopup(mkPopup(f.properties));}
  }).addTo(map);
}
try{const b=layer.getBounds();if(b.isValid())map.fitBounds(b.pad(0.1));else map.setView([48.1,-1.68],11);}
catch{map.setView([48.1,-1.68],11);}

// Toutes les données sont embarquées dans D — pas de fetch nécessaire
const allItems = D.type==="geojson" ? D.geojson.features : D.points;
let offset = Math.min(BATCH, allItems.length);  // rendu initial

function majInfo(){
  const n=offset, tot=D.nb_total;
  document.getElementById("info").textContent=
    n<tot ? `${n.toLocaleString("fr")} / ${tot.toLocaleString("fr")} éléments`
          : `${n.toLocaleString("fr")} élément${n>1?"s":""}`;
}
function majBouton(){
  const btn=document.getElementById("btn-plus");
  const restant=allItems.length-offset;
  if(restant<=0){btn.style.display="none";return;}
  btn.style.display="";
  btn.textContent=`Afficher 5 000 de plus (${restant.toLocaleString("fr")} restants)`;
}

function chargerPlus(){
  const batch=allItems.slice(offset, offset+BATCH);
  if(D.type==="geojson") ajouterGeoJSON(batch); else ajouterPoints(batch);
  offset+=batch.length;
  majInfo(); majBouton();
}

majInfo();
if(D.tronque) majBouton();
</script>
</body>
</html>
